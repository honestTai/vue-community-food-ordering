# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 9700
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8

# 日志配置
logging:
  level:
    com.app.photo: debug
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: dev
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  10MB
      # 设置总上传的文件大小
      max-request-size:  20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  mvc:
    static-path-pattern: /images/**
  resources:
    static-locations: file:${file-path}


file-path: ${TAKEOUT_FILE_PATH:./uploads/foods/}
file-url: ${TAKEOUT_FILE_URL:http://127.0.0.1:9700/images/}






